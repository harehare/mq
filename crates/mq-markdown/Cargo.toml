[package]
authors.workspace = true
categories = ["command-line-utilities", "text-processing"]
description = "Markdown parsing and manipulation utilities for mq"
edition.workspace = true
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query"]
license.workspace = true
name = "mq-markdown"
readme = "../../README.md"
repository.workspace = true
version.workspace = true

[dependencies]
ego-tree = {workspace = true, optional = true}
itertools = {workspace = true}
markdown = {workspace = true}
miette = {workspace = true}
rustc-hash = {workspace = true}
scraper = {workspace = true, optional = true}
serde = {workspace = true, features = ["derive"], optional = true}
serde_json = {workspace = true, optional = true}
smol_str = {workspace = true}
unicode-width = {workspace = true}
url = {workspace = true, optional = true}
yaml-rust2 = {workspace = true, optional = true}

[dev-dependencies]
divan = {workspace = true}
proptest = {workspace = true}
rstest = {workspace = true}
ureq = {workspace = true}

[[bench]]
harness = false
name = "benchmark"

[features]
callout = []
color = []
default = ["std"]
embed = []
html-to-markdown = ["dep:scraper", "dep:ego-tree", "dep:serde_json", "dep:yaml-rust2", "dep:url"]
json = ["dep:serde", "dep:serde_json", "smol_str/serde"]
obsidian = ["wikilink", "callout", "embed"]
std = []
wikilink = []
