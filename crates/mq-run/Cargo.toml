[package]
authors = ["Takahiro Sato <harehare1110@gmail.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "Command-line interface for mq Markdown processing tool"
edition = "2024"
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query"]
license = "MIT"
name = "mq-run"
readme = "../../README.md"
repository = "https://github.com/harehare/mq"
version = "0.8.4"
default-run = "mq"

[features]
css-selector = ["mq-lang/css-selector"]
debugger = ["mq-lang/debugger", "dep:rustyline", "dep:strum", "dep:regex", "mq-dap", "debug-trace"]
debug-trace = ["debugger", "tarn", "mq-lang/debug-trace"]
default = ["std", "use_mimalloc", "http-import", "css-selector", "watch"]
http-import = ["mq-lang/http-import-ureq"]
std = []
tarn = ["mq-lang/tarn"]
tiktoken = ["mq-lang/tiktoken"]
use_mimalloc = ["mimalloc"]
watch = ["dep:notify"]

[dependencies]
clap = {workspace = true, features = ["derive"]}
clap_complete = {workspace = true}
clap_complete_nushell = {workspace = true}
colored = {workspace = true}
csv = {workspace = true}
dirs = {workspace = true}
flate2 = {workspace = true}
glob = {workspace = true}
miette = {workspace = true, features = ["fancy"]}
mimalloc = {workspace = true, features = ["v3"], optional = true}
mq-dap = {workspace = true, optional = true}
mq-help = {workspace = true}
mq-lang = {workspace = true, features = ["file-io", "process-io"]}
mq-markdown = {workspace = true, features = ["json", "html-to-markdown", "color"]}
mq-repl = {workspace = true}
notify = {workspace = true, optional = true}
quick-xml = {workspace = true}
rayon = {workspace = true}
rustc-hash = {workspace = true}
serde_json = {workspace = true}
similar = {workspace = true}
yaml-rust2 = {workspace = true}
regex = {workspace = true, optional = true}
rustyline = {workspace = true, optional = true, default-features = false, features = ["custom-bindings", "with-file-history"]}
strum = {workspace = true, features = ["derive"], optional = true}
tabled = {workspace = true}
toml = {workspace = true}
toon-format = {workspace = true}
which = "8.0.2"

[dev-dependencies]
assert_cmd = {workspace = true}
base64 = {workspace = true}
rstest = {workspace = true}
scopeguard = {workspace = true}
tempfile = {workspace = true}

[[bin]]
doc = false
name = "mq"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
doc = false
name = "mq-dbg"
path = "src/bin/dbg.rs"
required-features = ["debugger"]

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/mq-{ target }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.mq-dbg]
pkg-url = "{ disabled }"

[package.metadata.deb]
assets = [
  ["target/release/mq", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/mq/README", "644"],
]
copyright = "2024, Takahiro Sato <harehare1110@gmail.com>"
extended-description = "mq is a jq-like command-line tool for Markdown processing. It allows you to easily slice, filter, map, and transform Markdown files."
license-file = ["../../LICENSE", "0"]
maintainer = "Takahiro Sato <harehare1110@gmail.com>"
priority = "optional"
section = "utils"

[package.metadata.generate-rpm]
assets = [
  {source = "target/release/mq", dest = "/usr/bin/mq", mode = "755"},
  {source = "../../README.md", dest = "/usr/share/doc/mq/README", mode = "644"},
]
