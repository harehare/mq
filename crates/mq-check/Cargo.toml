[package]
authors.workspace = true
categories = ["command-line-utilities", "text-processing"]
description = "Type checker for mq"
edition.workspace = true
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query"]
license.workspace = true
name = "mq-check"
readme = "README.md"
repository.workspace = true
version.workspace = true

[features]
cli = ["dep:clap", "dep:colored", "dep:serde_json", "dep:url"]

[[bin]]
name = "mq-check"
path = "src/main.rs"
required-features = ["cli"]

[package.metadata.binstall]
pkg-fmt = "bin"
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-{ target }{ binary-ext }"
disabled-strategies = ["quick-install"]

[dependencies]
clap = {workspace = true, features = ["derive"], optional = true}
colored = {workspace = true, optional = true}
miette = {workspace = true, features = ["fancy"]}
mq-hir = {workspace = true}
mq-lang = {workspace = true, features = ["cst", "file-io"]}
rustc-hash = {workspace = true}
serde_json = {workspace = true, optional = true}
slotmap = {workspace = true}
smol_str = {workspace = true}
thiserror = {workspace = true}
url = {workspace = true, optional = true}

[dev-dependencies]
rstest = {workspace = true}
