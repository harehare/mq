[package]
authors.workspace = true
categories = ["command-line-utilities", "text-processing"]
description = "Documentation catalog for mq: extracts and unifies docs for native builtins, selectors, and mq-defined functions"
edition.workspace = true
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query", "documentation"]
license.workspace = true
name = "mq-help"
readme = "README.md"
repository.workspace = true
version.workspace = true

[features]
# Help catalog and rendering. Without it only the static doc tables are built.
catalog = ["dep:colored", "dep:mq-lang", "dep:serde"]
default = ["catalog"]

[dependencies]
colored = {workspace = true, optional = true}
mq-lang = {workspace = true, features = ["cst", "http"], optional = true}
serde = {workspace = true, features = ["derive"], optional = true}

[dev-dependencies]
mq-lang = {workspace = true, features = ["css-selector"]}
