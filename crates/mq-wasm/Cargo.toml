[package]
authors.workspace = true
categories = ["command-line-utilities", "text-processing"]
description = "WebAssembly bindings for mq Markdown processing"
edition.workspace = true
homepage = "https://mqlang.org/"
keywords = ["markdown", "jq", "query"]
license.workspace = true
name = "mq-wasm"
publish = false
readme = "README.md"
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
itertools = {workspace = true}
js-sys = {workspace = true}
md5 = {workspace = true}
mq-formatter = {workspace = true, optional = true}
mq-hir = {workspace = true, optional = true}
mq-check = {workspace = true, optional = true}
mq-help = {workspace = true, optional = true}
mq-lang = {path = "../mq-lang", version = "0.10.2", default-features = false, features = ["http-import", "wasm"]}
mq-syntax = {workspace = true}
mq-markdown = {workspace = true}
opfs = {workspace = true, optional = true}
serde = {workspace = true, features = ["derive"]}
serde-wasm-bindgen = {workspace = true}
serde_json = {workspace = true, optional = true}
wasm-bindgen = {workspace = true}
wasm-bindgen-futures = {workspace = true}
web-sys = {version = "0.3", features = ["Response", "console"]}

[dev-dependencies]
wasm-bindgen-test = {workspace = true}

[features]
default = ["opfs", "lang-service", "html"]
html = ["mq-lang/html-to-markdown", "mq-markdown/html-to-markdown"]
lang-service = [
  "dep:mq-check",
  "dep:mq-formatter",
  "dep:mq-help",
  "dep:mq-hir",
  "dep:serde_json",
  "mq-lang/ast-json",
  "mq-syntax/cst",
]
opfs = ["dep:opfs"]
test-in-worker = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O4', '--enable-simd', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen-futures"]
