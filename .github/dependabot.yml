version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/packages/mq-playground"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/packages/mq-web"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # typescript@7's native compiler drops the classic JS API that
      # tsup's bundled rollup-plugin-dts depends on, breaking `dts: true`
      # builds. Stay on 6.x until tsup/rollup-plugin-dts support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
      semver-major-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "20:00"
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

