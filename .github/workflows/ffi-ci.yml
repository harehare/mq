name: ffi C tests

on:
  push:
    branches: ["main"]
    paths:
      - 'crates/mq-ffi/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'crates/mq-ffi/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  c-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run mq-ffi C API tests
        working-directory: crates/mq-ffi
        run: make test
