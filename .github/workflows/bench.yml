name: benchmarks

on:
  push:
    branches: ["main"]
    paths:
      - 'crates/mq-lang/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'crates/mq-lang/**'

concurrency:
  group: "benchmarks"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: Install codspeed
        run: cargo install cargo-codspeed --locked
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          run: just bench
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
