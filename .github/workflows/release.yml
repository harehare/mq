name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            asset_name: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            ext: ""
            asset_name: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            asset_name: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            ext: ""
            asset_name: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset_name: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            asset_name: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            asset_name: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: just build-target ${{ matrix.target }}
      - name: Rename artifact
        run: |
          mv target/${{ matrix.target }}/release/mq${{ matrix.ext }} target/${{ matrix.target }}/release/mq-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-dbg${{ matrix.ext }} target/${{ matrix.target }}/release/mq-dbg-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-lsp${{ matrix.ext }} target/${{ matrix.target }}/release/mq-lsp-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-check${{ matrix.ext }} target/${{ matrix.target }}/release/mq-check-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-lint${{ matrix.ext }} target/${{ matrix.target }}/release/mq-lint-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-crawl${{ matrix.ext }} target/${{ matrix.target }}/release/mq-crawl-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-test${{ matrix.ext }} target/${{ matrix.target }}/release/mq-test-${{ matrix.asset_name}}${{ matrix.ext }}
          mv target/${{ matrix.target }}/release/mq-fmt${{ matrix.ext }} target/${{ matrix.target }}/release/mq-fmt-${{ matrix.asset_name}}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mq-${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/mq-${{ matrix.asset_name}}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-dbg-${{ matrix.asset_name}}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-lsp-${{ matrix.asset_name }}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-check-${{ matrix.asset_name }}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-lint-${{ matrix.asset_name }}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-crawl-${{ matrix.asset_name }}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-test-${{ matrix.asset_name }}${{ matrix.ext }}
            target/${{ matrix.target }}/release/mq-fmt-${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  deb:
    name: Build deb (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-deb
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: just build-target ${{ matrix.target }}
      - name: Build deb package
        run: cargo deb -p mq-run --no-build --target ${{ matrix.target }} --output target/${{ matrix.target }}/debian/mq-${{ matrix.target }}.deb
      - name: Upload deb artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mq-${{ matrix.target }}-deb
          path: target/${{ matrix.target }}/debian/*.deb
          if-no-files-found: error
          retention-days: 1

  rpm:
    name: Build rpm (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-generate-rpm
      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: just build-target ${{ matrix.target }}
      - name: Build rpm package
        run: cargo generate-rpm -p crates/mq-run --target ${{ matrix.target }} -o target/${{ matrix.target }}/generate-rpm/mq-${{ matrix.target }}.rpm
      - name: Upload rpm artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mq-${{ matrix.target }}-rpm
          path: target/${{ matrix.target }}/generate-rpm/*.rpm
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Build Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-22.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Push multi-arch Docker manifest
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: Inspect image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE_REF"
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"

  checksums:
    name: Checksums and SBOM
    needs: [build, deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          cache: false
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-cyclonedx
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mq*
          path: target
      - name: Generate SBOM
        run: |
          mkdir -p target/sbom
          cargo cyclonedx --manifest-path crates/mq-run/Cargo.toml --format json --spec-version 1.5 --override-filename mq
          mv crates/mq-run/mq.json target/sbom/mq.cdx.json
      - name: Generate checksums
        run: |
          cd target
          for file in mq*/* sbom/*; do
            sha256sum "$file" >> checksums.txt
          done
          mkdir checksums
          mv checksums.txt ./checksums/checksums.txt
      - name: Upload checksums and SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-checksums
          path: |
            target/sbom/mq.cdx.json
            target/checksums/checksums.txt
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and attest
    needs: [checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mq*
          path: target
      - name: Download checksums and SBOM
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-checksums
          path: target
      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle target/checksums/checksums.txt.sigstore.json \
            target/checksums/checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            target/mq*/*
            target/checksums/checksums.txt
      - name: Attest SBOM
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-path: target/mq*/*
          sbom-path: target/sbom/mq.cdx.json
      - name: Upload signature
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-signature
          path: target/checksums/checksums.txt.sigstore.json
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    needs: [sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mq*
          path: target
      - name: Download checksums and SBOM
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-checksums
          path: target
      - name: Download signature
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-signature
          path: target
      - name: Create Release
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            target/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
