name: Node.js CI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/mq-nodejs/**"
      - "crates/mq-wasm/**"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/mq-nodejs/**"
      - "crates/mq-wasm/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install wasm-pack
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: wasm-pack
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/mq-nodejs/package.json
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - name: Install dependencies
        working-directory: packages/mq-nodejs
        run: pnpm install --frozen-lockfile
      - name: Build
        run: just build-node
      - name: Type check
        working-directory: packages/mq-nodejs
        run: pnpm run type-check
      - name: Lint
        working-directory: packages/mq-nodejs
        run: pnpm run lint
      - name: Test
        working-directory: packages/mq-nodejs
        run: pnpm run test
