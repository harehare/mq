name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic backtraces; full debug info only slows linking and bloats the cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test-mq:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure RUSTFLAGS for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C link-args=/STACK:8388608" >> $GITHUB_ENV
      - name: Run mq tests and doc examples
        run: just test-mq test-doc-examples

  test-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run doc tests
        run: just test-doc

  # ubuntu runs the all-features superset, macOS and Windows run the default features.
  test-workspace:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tools
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest
      - name: Configure RUSTFLAGS for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "RUSTFLAGS=${RUSTFLAGS} -C link-args=/STACK:8388608" >> $GITHUB_ENV
      - name: Run tests
        run: just test-workspace
        env:
          NEXTEST_RETRIES: 3

  test-all-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tools
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest,cargo-llvm-cov
      - name: Run tests
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: just test-all-features
        env:
          NEXTEST_RETRIES: 3
      - name: Run tests with code coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
        env:
          NEXTEST_RETRIES: 3
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: true

  test-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install tools
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: nextest
      - name: Run feature-gated tests
        run: just test-lang-cached test-default
        env:
          NEXTEST_RETRIES: 3

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: harehare/setup-mq@v1.1.7
        with:
          bins: fmt
      - name: Run format and .mq lint checks
        run: just fmt fmt-mq lint-mq

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run lint
        run: just lint

  check-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.2
        with:
          command: check bans licenses sources

  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - uses: harehare/setup-mq@v1.1.7
        with:
          bins: docs
      - name: Check docs
        run: just docs
      - name: Check for diffs in docs
        run: |
          if [[ -n $(git status --porcelain docs/) ]]; then
            echo "Error: Changes detected in docs directory. Please commit these changes."
            git status --porcelain docs/
            exit 1
          fi

