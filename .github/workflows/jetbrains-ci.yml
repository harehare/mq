name: JetBrains Plugin CI

on:
  push:
    branches: ["main"]
    paths:
      - "editors/jetbrains/**"
  pull_request:
    branches: ["main"]
    paths:
      - "editors/jetbrains/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build plugin
        working-directory: editors/jetbrains
        run: ./gradlew buildPlugin --stacktrace
