name: Deploy docs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: packages/mq-playground/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          cache: false
      - name: Install tools
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: wasm-pack,mdbook
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.58.0
      - name: Build mdbook
        run: mdbook build -d ../book
        working-directory: ./docs/books
      - name: Install playground dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./packages/mq-playground
      - name: Build playground
        run: pnpm run build
        working-directory: ./packages/mq-playground
      - name: Copy install script
        run: |
          cp ./scripts/install.sh ./docs
          cp ./scripts/install.ps1 ./docs
          cp ./scripts/install_lsp.sh ./docs
          cp ./scripts/install_crawler.sh ./docs
      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
